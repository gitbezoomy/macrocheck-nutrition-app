name: macrocheck
description: A new Flutter project for nutritional consultation.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.4.0
  flutter_riverpod: ^2.4.9
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  image_picker: ^1.0.7
  mime: ^1.0.6
  shared_preferences: ^2.2.2
  table_calendar: ^3.1.0
  mobile_scanner: ^5.1.0
  speech_to_text: ^7.3.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.1
  sqlite3_flutter_libs: ^0.5.18
  path: ^1.9.0
  crypto: ^3.0.3
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/db/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_v1.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F8F9FA"
  image: assets/images/logo_v1.png
  android_12:
    image: assets/images/logo_v1.png
    color: "#F8F9FA"
